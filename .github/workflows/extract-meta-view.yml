name: Extract META VIEW source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project into repository root
        run: |
          if [ ! -f meta-view-v3.zip ]; then
            echo "Archive not present; nothing to extract."
            exit 0
          fi
          mkdir -p /tmp/meta-view
          unzip -q meta-view-v3.zip -d /tmp/meta-view
          cp -a /tmp/meta-view/meta-view/. .
          rm -rf /tmp/meta-view
          rm -f meta-view-v3.zip
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Add META VIEW v3 source files"
            git push
          fi
